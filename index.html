<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <script>
        function redirectToRandomPage() {
            const links = [
                "html/car/",
                "html/click/",
                "html/lastwar",
                "html/tabletennis",
                "html/tetris"
            ];

            const randomIndex = Math.floor(Math.random() * links.length);
            window.location.href = links[randomIndex];
        }

        // Run instantly on initial page load
        redirectToRandomPage();

        // Detects if the user came to this page via the browser "Back" or "Forward" button
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                // If the page was loaded from the browser cache (back button), redirect again
                redirectToRandomPage();
            }
        });
    </script>
</head>
<body>
    <p>Redirecting you to a random page...</p>
</body>
</html>
